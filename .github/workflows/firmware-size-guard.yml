name: Firmware Size Guard

on:
  push:
  pull_request:

jobs:
  size-guard:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Enforce the binary budget
        # The application slot is 1920 KiB after the peripheral drivers were
        # added. The guard leaves a margin so a build never fills the slot
        # completely.
        run: ./scripts/check-binary-size.sh --build-dir build --binary zclaw.bin --max-bytes 1887436
